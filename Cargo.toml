[package]
name = "plumbob"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
description = "FRL link training state machine for HDMI 2.1"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/ashlar-display/plumbob"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "no-std", "frl", "link-training"]
categories = ["hardware-support", "embedded", "no-std", "no-std::no-alloc"]

[features]
alloc = []
std = ["alloc"]

[dependencies]
hdmi-hal = { version = "0.6", default-features = false }
display-types = { version = ">=0.4.3, <0.6", default-features = false }

# Prototype against hdmi-hal's unreleased breaking release (release order step 2): a pushed
# commit of its feat/tmds-phy branch, moved by hand. Removed when hdmi-hal is released.
[patch.crates-io]
hdmi-hal = { git = "https://github.com/ashlar-display/hdmi-hal", rev = "35131adfe65067620e004665f6e2a88a4dbd6fb9" }
