[package]
name = "plumbob"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "FRL link training state machine for HDMI 2.1"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/DracoWhitefire/plumbob"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "no-std", "frl", "link-training"]
categories = ["hardware-support", "embedded", "no-std", "no-std::no-alloc"]

[features]
alloc = []
std = ["alloc"]

[dependencies]
hdmi-hal = { version = "0.5.1", default-features = false }
display-types = { version = "0.4", default-features = false }
