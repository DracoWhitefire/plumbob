[workspace]

[package]
name = "simulate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
plumbob = { path = "../..", features = ["std"] }
hdmi-hal = { version = "0.6" }
display-types = { version = ">=0.4.3, <0.6" }

# Prototype against hdmi-hal's unreleased breaking release: a pushed
# commit of its feat/tmds-phy branch, moved by hand. Removed when hdmi-hal is released.
[patch.crates-io]
hdmi-hal = { git = "https://github.com/ashlar-display/hdmi-hal", rev = "35131adfe65067620e004665f6e2a88a4dbd6fb9" }
